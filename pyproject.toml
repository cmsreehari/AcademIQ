[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "studyflow"
version = "0.1.0"
description = "Student Risk Report Web Application"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
    "joblib",
    "streamlit",
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]